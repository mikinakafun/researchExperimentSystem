schema_version: "1.0"
spec_version: "0.3.0-draft"
created_at: "2026-07-15"
updated_at: "2026-09-07"
status: "pending_cognitive_interview_and_pilot"
# 2026-09-07: rebuilt for the two-condition design . Item wording is
# unchanged from v0.2.0 ; only roles, expected directions and the contrast moved.

administration:
  timing: "after_all_primary_and_secondary_outcome_ratings_before_debriefing"
  order: "fixed"
  one_item_per_screen: true
  required: true
  response_type: "radio"
  default_selection: null
  scale:
    min: 1
    max: 7
    labels:
      ja:
        1: "全く向けなかった／全く感じなかった"
        4: "中程度"
        7: "非常に強く向けた／非常に強く感じた"
      en:
        1: "Not at all"
        4: "Moderately"
        7: "Very much"
  store_fields:
    - "item_id"
    - "displayed_language"
    - "exact_displayed_text"
    - "rating"
    - "presented_at"
    - "answered_at"

items:
  - id: "MC-EVENT"
    category: "dilution_diagnostic"
    construct: "attention_to_event_structure"
    role_note: "Not a manipulation check. With the standard arm retired, event-structure attention enters only through neutral questions; this item measures that dilution. Read it with the per-session neutral-transition count, not as a condition contrast."
    text:
      ja: "提示された質問は、出来事の中での行動、人物、やり取り、起きた順序に、どの程度あなたの注意を向けましたか。"
      en: "To what extent did the questions direct your attention to actions, people, interactions, and the sequence of the event?"
    anchors:
      ja: {1: "全く向けなかった", 7: "非常に強く向けた"}
      en: {1: "Not at all", 7: "Very much"}
  - id: "MC-VISUAL"
    category: "manipulation_check"
    expected_direction: "higher_under_visual"
    construct: "attention_to_visual_details"
    text:
      ja: "提示された質問は、物や人の見た目、色、明るさ、配置などの視覚的な詳細に、どの程度あなたの注意を向けましたか。"
      en: "To what extent did the questions direct your attention to visual details, such as the appearance, colors, lighting, or arrangement of objects and people?"
    anchors:
      ja: {1: "全く向けなかった", 7: "非常に強く向けた"}
      en: {1: "Not at all", 7: "Very much"}
  - id: "MC-ODOR"
    category: "manipulation_check"
    expected_direction: "higher_under_odor"
    construct: "attention_to_odor"
    text:
      ja: "提示された質問は、匂いや空気のにおいに、どの程度あなたの注意を向けましたか。"
      en: "To what extent did the questions direct your attention to smells or the scent of the air?"
    anchors:
      ja: {1: "全く向けなかった", 7: "非常に強く向けた"}
      en: {1: "Not at all", 7: "Very much"}
  - id: "DQ-PRESSURE"
    category: "data_quality_diagnostic"
    construct: "pressure_to_report_unremembered_details"
    text:
      ja: "実際には思い出せない詳細まで答えるよう求められていると、どの程度感じましたか。"
      en: "To what extent did you feel that you were being asked to provide details you could not actually remember?"
    anchors:
      ja: {1: "全く感じなかった", 7: "非常に強く感じた"}
      en: {1: "Not at all", 7: "Very much"}
  - id: "DQ-MEMORYBASIS"
    category: "data_quality_diagnostic"
    construct: "answers_based_on_remembered_content"
    text:
      ja: "あなたの回答は、推測ではなく、実際に思い出せた内容にどの程度基づいていましたか。"
      en: "To what extent were your answers based on details you actually remembered rather than guesses?"
    anchors:
      ja: {1: "全く基づいていなかった", 7: "完全に基づいていた"}
      en: {1: "Not at all", 7: "Completely"}
  - id: "DQ-UNSAID"
    category: "data_quality_diagnostic"
    construct: "perceived_unprovided_content_in_narrative"
    text:
      ja: "作成された文章には、あなたが答えていない内容が、どの程度含まれていたと感じましたか。"
      en: "To what extent did you feel that the generated story contained content you had not provided in your answers?"
    anchors:
      ja: {1: "全く含まれていなかった", 7: "非常に多く含まれていた"}
      en: {1: "Not at all", 7: "Very much"}

analysis:
  manipulation_check_items:
    - "MC-ODOR"
    - "MC-VISUAL"
  contrast:
    condition_order:
      - "visual"
      - "odor"
    coefficients:
      - -1
      - 1
    interpretation: "Odor minus Visual"
    expected_sign:
      MC-ODOR: "positive"
      MC-VISUAL: "negative"
  diagnostics:
    - item: "MC-EVENT"
      role: "dilution_of_manipulation"
      read_with: "neutral_transition_count_per_session"
    - item: "DQ-PRESSURE"
      role: "data_quality"
    - item: "DQ-MEMORYBASIS"
      role: "data_quality"
    - item: "DQ-UNSAID"
      role: "data_quality"
  report_alongside_every_manipulation_check:
    - "fallback_count_per_session_per_condition"
    - "neutral_transition_count_per_session_per_condition"
  evidence_classification:
    strong: "Contrast estimate is in the expected direction and its two-sided 95% confidence interval excludes zero."
    inconclusive: "Contrast estimate is in the expected direction but its two-sided 95% confidence interval includes zero."
    failed_or_reversed: "Contrast estimate is zero or in the opposite direction."
  participant_exclusion_based_on_items: false
  include_as_covariate_in_primary_outcome_model: false
  report_all_items: true

rules:
  - "Present manipulation-check items only after all outcome ratings."
  - "Do not show condition-specific explanations before the items."
  - "Do not exclude participants because their manipulation-check rating is low."
  - "Do not replace randomized condition assignment with manipulation-check responses in the primary analysis."
  - "Do not combine the attention items into a single total score; read MC-VISUAL and MC-ODOR separately."
  - "Treat MC-EVENT, DQ-PRESSURE and DQ-MEMORYBASIS as diagnostics, not manipulation-check outcomes."
  - "Report per-condition fallback and neutral-transition counts alongside every manipulation-check result; both are reductions in the delivered dose . Never use either as an exclusion criterion or a covariate."
  - "Treat DQ-UNSAID as a per-condition diagnostic of perceived unprovided content; never use it for exclusion, regeneration, or as a covariate ."
