schema_version: "1.0"
spec_version: "0.1.0-draft"
created_at: "2026-07-15"
status: "superseded_by_DEC-029_pending_generation_spec"
superseded_by: "DEC-029"
note: "This file preserves the fixed-question draft for history. It is not the current implementation specification."
language_policy:
  source_language: "ja"
  supported_languages:
    - "ja"
    - "en"
  translation_note: "Japanese is the source version. English is a meaning-matched study version, not a word-for-word translation."

administration:
  question_count_per_condition: null
  order: "sequential_llm_generation"
  branching: "bounded_by_predefined_turn_count"
  show_condition_name_to_participant: false
  one_question_per_screen: true
  response:
    type: "textarea"
    required: true
    recommended_sentences:
      min: 1
      max: 3
    minimum_characters_after_trim: 1
    maximum_characters:
      ja: 300
      en: 600
    allow_no_recall_response: true
    no_recall_text:
      ja: "思い出せない"
      en: "I don't remember."
    instruction:
      ja: "1〜3文で回答してください。思い出せない場合は「思い出せない」と入力してください。"
      en: "Answer in 1–3 sentences. If you cannot remember, enter “I don't remember.”"

cross_condition_rules:
  - "Present the same pre-approved number of generated questions in every condition."
  - "Generate exactly one question per turn using the condition-specific constraint."
  - "Reject or regenerate questions that violate the condition constraint, repeat prior questions, or pressure the participant to invent details."
  - "Accept spontaneous details outside the assigned focus, but do not probe them."
  - "Do not tell participants which experimental condition they received."
  - "Do not imply that a sensory detail must have existed or must be remembered."
  - "Store question ID, displayed language, exact displayed text, answer, and timestamps."

conditions:
  standard:
    internal_label: "Standard"
    participant_visible_label: null
    focus: "Events, people, places, and sequence without actively directing attention to a sensory modality."
    questions:
      - id: "STD-01"
        order: 1
        correspondence: "context"
        text:
          ja: "その出来事は、いつごろ、どこで、どのような状況で起きましたか。"
          en: "When and where did the event take place, and what was the situation?"
      - id: "STD-02"
        order: 2
        correspondence: "people_and_content"
        text:
          ja: "その場には誰がいて、あなたと周囲の人は何をしていましたか。"
          en: "Who was there, and what were you and the people around you doing?"
      - id: "STD-03"
        order: 3
        correspondence: "onset_and_change"
        text:
          ja: "その出来事はどのように始まり、その直後に何が起きましたか。"
          en: "How did the event begin, and what happened immediately afterward?"
      - id: "STD-04"
        order: 4
        correspondence: "response_during_event"
        text:
          ja: "出来事が進む間、あなたは何をし、どのように感じましたか。"
          en: "As the event unfolded, what did you do, and how did you feel?"
      - id: "STD-05"
        order: 5
        correspondence: "salient_detail_and_association"
        text:
          ja: "その出来事で最もはっきり覚えている詳細は何ですか。それはあなたに何を思い起こさせますか。"
          en: "What detail of the event do you remember most clearly, and what does it bring to mind?"

  non_odor:
    internal_label: "Non-Odor"
    participant_visible_label: null
    focus: "Visual, auditory, tactile, temperature, and bodily details without actively directing attention to odor."
    questions:
      - id: "NON-01"
        order: 1
        correspondence: "context"
        text:
          ja: "その場の見た目について、明るさ、色、物の配置、人の様子など、思い出せることを説明してください。"
          en: "Describe what you remember about how the setting looked, such as the light, colors, arrangement of objects, or appearance of people."
      - id: "NON-02"
        order: 2
        correspondence: "people_and_content"
        text:
          ja: "その場で聞こえた音や声について、種類、大きさ、聞こえた方向など、思い出せることを説明してください。"
          en: "Describe what you remember about sounds or voices, such as their type, volume, or direction."
      - id: "NON-03"
        order: 3
        correspondence: "onset_and_change"
        text:
          ja: "出来事の最中、肌に触れたもの、温度、湿度などはどのように感じられ、変化しましたか。"
          en: "During the event, how did things touching your skin, the temperature, or the humidity feel and change?"
      - id: "NON-04"
        order: 4
        correspondence: "response_during_event"
        text:
          ja: "それらの見た目、音、触感がある中で、身体や気分にどのような反応がありましたか。"
          en: "Among those sights, sounds, and tactile sensations, how did your body or mood respond?"
      - id: "NON-05"
        order: 5
        correspondence: "salient_detail_and_association"
        text:
          ja: "視覚、音、触感、身体感覚のうち、最もはっきり覚えている詳細は何ですか。それはあなたに何を思い起こさせますか。"
          en: "Which visual, auditory, tactile, or bodily detail do you remember most clearly, and what does it bring to mind?"

  odor_oriented:
    internal_label: "Odor-Oriented"
    participant_visible_label: null
    focus: "Odor, the scent of the air, odor source and change, odor-related responses, and odor-triggered associations."
    questions:
      - id: "ODO-01"
        order: 1
        correspondence: "context"
        text:
          ja: "その出来事の場で、匂いや空気のにおいについて何か思い出せますか。思い出せる場合、最初に浮かぶものを説明してください。"
          en: "Can you remember anything about a smell or the scent of the air during the event? If so, describe the first detail that comes to mind."
      - id: "ODO-02"
        order: 2
        correspondence: "people_and_content"
        text:
          ja: "その匂いについて、種類、強さ、快さまたは不快さなど、思い出せる特徴を説明してください。"
          en: "Describe any qualities of the smell that you remember, such as its type, intensity, or pleasantness or unpleasantness."
      - id: "ODO-03"
        order: 3
        correspondence: "onset_and_change"
        text:
          ja: "その匂いはどこから来て、出来事の間に強さや種類がどのように変化しましたか。"
          en: "Where did the smell come from, and how did its intensity or type change during the event?"
      - id: "ODO-04"
        order: 4
        correspondence: "response_during_event"
        text:
          ja: "その匂いに気づいたとき、身体や気分にどのような反応がありましたか。"
          en: "When you noticed the smell, how did your body or mood respond?"
      - id: "ODO-05"
        order: 5
        correspondence: "salient_detail_and_association"
        text:
          ja: "匂いや空気のにおいについて、最もはっきり覚えている詳細は何ですか。それはあなたに何を思い起こさせますか。"
          en: "What detail about the smell or scent of the air do you remember most clearly, and what does it bring to mind?"
